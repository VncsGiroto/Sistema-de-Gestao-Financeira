events {}
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # anti-bruteforce nos endpoints sensíveis (o Redis também limita por IP/endpoint)
  limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HSTS só tem efeito atrás de HTTPS (terminar TLS no proxy de prod)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP mínima p/ SPA: mesmo origem + inline styles (ECharts) + sem scripts inline
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    location /api/auth/login {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/recover {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location / {
      proxy_pass http://web:80;
    }
  }
}
